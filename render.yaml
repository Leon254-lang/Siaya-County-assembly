services:
  - type: web
    name: siaya-assembly-system
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        fromDatabase:
          name: siaya-assembly-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REQUIRE_PRIVILEGED_MFA
        value: "true"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        value: System Administrator
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        value: your_email@gmail.com
      - key: EMAIL_PASS
        value: your_app_password
      - key: EMAIL_FROM
        value: your_email@gmail.com
      - key: EMAIL_SECURE
        value: "false"

  # Provision this as a separate scheduled service. Keep the encryption key in
  # the platform secret environment store, never in source control.
  - type: cron
    name: siaya-assembly-daily-backup
    env: node
    plan: starter
    schedule: "0 2 * * *"
    buildCommand: npm install
    startCommand: bash scripts/backup_mongodb.sh
    envVars:
      - key: MONGO_URI
        fromDatabase:
          name: siaya-assembly-db
          property: connectionString
      - key: BACKUP_ENCRYPTION_KEY
        sync: false

databases:
  - name: siaya-assembly-db
    databaseName: siaya_assembly
    plan: free
    region: oregon

